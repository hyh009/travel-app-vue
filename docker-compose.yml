services:
  db:
    image: postgres:17
    container_name: travel-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travel -d travel_app']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
