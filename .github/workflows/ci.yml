name: CI

on:
  push:
    # TEMP: ci/deploy 只是為了在合併前測試部署流程,測完要拿掉
    branches: [main, ci/deploy]
  pull_request:
    branches: [main]
  # 可以在 Actions 頁面手動執行(用來測試部署流程)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 每次 push 和 PR 都跑:型別檢查、lint、格式、建置
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
          POSTGRES_DB: travel_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 和 Dockerfile 用同一個 pnpm 版本
      - run: npm install -g pnpm@11.28.10

      - run: pnpm install --frozen-lockfile

      # Prisma client 不在 git 裡,型別檢查前要先產生
      - run: pnpm --filter api db:generate

      - name: 型別檢查
        run: |
          pnpm --filter @travel/shared typecheck
          pnpm --filter api exec tsc --noEmit

      - name: Lint
        run: |
          pnpm --filter api exec eslint .
          pnpm --filter web exec oxlint .
          pnpm --filter web exec eslint .

      - name: 格式
        run: pnpm --filter web exec prettier --check src

      - name: 前端單元測試
        run: pnpm --filter web test

      - name: 後端 API 測試
        run: pnpm --filter api test

      # build 內含 vue-tsc 的型別檢查
      - name: 前端建置
        run: pnpm --filter web build

  # check 通過後,SSH 進 Lightsail 更新網站。PR 只跑 check,不會部署
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 同時只跑一個部署;後面的排隊等前面的做完,不要中途取消
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # secrets 一律走環境變數,不要直接寫進 run 的字串裡
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: 準備 SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # 伺服器的公鑰(Variables,不是機密)。連線時用它確認對方真的是我們的伺服器
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      # git pull --ff-only:伺服器上的程式碼和 GitHub 有分歧就拒絕,不會悄悄合併
      # docker compose up -d --build:先建置,成功了才換掉舊容器,建置失敗時舊版繼續運作
      - name: 部署
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             cd ~/travel-app-vue
             git pull --ff-only origin main
             docker compose up -d --build
             docker image prune -f'

      # 容器重啟需要幾秒,所以重試;一直不是 200 就讓這個 job 失敗
      - name: 健康檢查
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://54-66-110-220.sslip.io/api/health
